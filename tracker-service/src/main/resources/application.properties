spring.application.name=tracker-service
spring.data.redis.host=127.0.0.1
spring.data.redis.port=6379
spring.data.redis.repositories.enabled=false

# Peer tokens. Set a real secret of at least 32 bytes per deployment; leaving it
# empty generates a random one at startup, so tokens die on restart by design.
swarmedge.tracker.token-secret=
swarmedge.tracker.token-ttl-seconds=300

# Operational endpoints. Paper numbers still come from research/raw, not from this scrape.
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=never
