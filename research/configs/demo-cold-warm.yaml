# Demo smoke (blueprint P12-01). Not a paper claim.
# One leecher, eight seeders, one same-site EDGE, then the same leecher again
# with the cache still warm. Numbers come out of the run.
scenarioId: demo-cold-warm
baseline: B6
cacheState: warm
description: Recruiter demo. Cold leecher, then the same asset with a warm cache.

asset:
  productId: game-x
  version: 1.4.0
  fileName: game-x-demo.bin
  sizeBytes: 2048
  chunkSizeBytes: 256

run:
  repetitions: 2
  seed: 20260926
  coldCache: false

swarm:
  maxPeers: 9
  seederCount: 8
  blockSizeBytes: 256
  outstandingRequestsPerPeer: 4
  blockTimeoutMillis: 5000
  handshakeTimeoutMillis: 5000
  connectTimeoutMillis: 2000
  stallTimeoutMillis: 20000
  maxAttemptsPerBlock: 3

topology:
  leecher:
    siteId: hq
    networkGroupId: floor-2
  edge:
    siteId: hq
    networkGroupId: floor-2
  seeders:
    - { siteId: hq, networkGroupId: floor-2 }
    - { siteId: hq, networkGroupId: floor-2 }
    - { siteId: hq, networkGroupId: floor-9 }
    - { siteId: hq, networkGroupId: floor-9 }
    - { siteId: branch, networkGroupId: wifi }
    - { siteId: branch, networkGroupId: wifi }
    - { siteId: branch, networkGroupId: dc }
    - { siteId: branch, networkGroupId: dc }

scheduler:
  sourcePolicy: LAPS
  lapsWeights:
    locality: 0.35
    throughput: 0.30
    rtt: 0.15
    capacity: 0.10
    health: 0.10
  endgameThresholdBlocks: 0

fallback:
  edgeAfterMillis: 200
  originAfterMillis: 5000
  jitterMillis: 0
  maxOriginInFlight: 2
  pipelineFillTarget: 0.5

edge:
  count: 1
  uploadBytesPerSecond: 125000000

churn:
  mode: none
  killFractions: [0.0]
  everyPeerHoldsEverything: true

scale:
  peers: 8
  clients: 1
network:
  profile: loopback
  delayMillis: 0
  jitterMillis: 0
  lossPercent: 0
